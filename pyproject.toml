[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[project]
name = "kksubs"
version = "3.2.0-dev"
requires-python = ">=3.10"
dependencies = [
    "natsort",
    "numpy",
    "opencv-python",
    "packaging",
    "pillow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.14.14",
]

[project.scripts]
koi = "kksubs.koi.cli:cli"

[tool.uv.build-backend]
module-name = "kksubs"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
